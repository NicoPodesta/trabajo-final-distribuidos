<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:650px;height:546px;background:#FFFFFF;" width="650px" height="546px" viewBox="0 0 650 546" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="170.364" y="32.995" fill="#000" font-size="14" textLength="307.645" font-weight="700">Actividad · Image Fetcher · Una réplica</text></g><ellipse cx="307.28" cy="62.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="179.094" y="148.007" width="256.373" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="189.094" y="169.146" fill="#000" font-size="12" textLength="236.373">Tomar una imagen de cualquier cliente</text><text x="189.094" y="183.115" fill="#000" font-size="12" textLength="98.854">si hay cupo libre</text><rect x="41" y="215.945" width="534.561" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="53" y="241.945" width="204.799" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="63" y="263.083" fill="#000" font-size="12" textLength="184.799">Descargar la imagen completa</text><text x="63" y="277.052" fill="#000" font-size="12" textLength="106.236">a un archivo local</text><rect x="285.799" y="241.945" width="275.762" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="295.799" y="263.083" fill="#000" font-size="12" textLength="195.264">Publicar sus trozos en la cola Q2</text><text x="295.799" y="277.052" fill="#000" font-size="12" textLength="255.762">(espera solo esta publicación si está llena)</text><rect x="41" y="309.882" width="534.561" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="196.546" y="335.882" width="221.469" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="206.546" y="357.021" fill="#000" font-size="12" textLength="201.469">Borrar el archivo y liberar el cupo</text><polygon points="276.665,92.297,337.896,92.297,349.896,104.297,337.896,116.297,276.665,116.297,264.665,104.297,276.665,92.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="311.28" y="126.507" fill="#000" font-size="11" textLength="13.702">no</text><text x="276.665" y="108.105" fill="#000" font-size="11" textLength="61.23">¿SIGTERM?</text><text x="255.878" y="101.703" fill="#000" font-size="11" textLength="8.787">sí</text><rect x="187.461" y="411.851" width="239.639" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="197.461" y="432.99" fill="#000" font-size="12" textLength="219.639">Cerrar descargas, borrar temporales</text><text x="197.461" y="446.958" fill="#000" font-size="12" textLength="135.855">y cerrar el middleware</text><path d="M338.28,469.789 L338.28,493.488 L318.28,497.488 L338.28,501.488 L338.28,525.187 A0,0 0 0 0 338.28,525.187 L629.373,525.187 A0,0 0 0 0 629.373,525.187 L629.373,479.789 L619.373,469.789 L338.28,469.789 A0,0 0 0 0 338.28,469.789" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M619.373,469.789 L619.373,479.789 L629.373,479.789 L619.373,469.789" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="344.28" y="486.855" fill="#000" font-size="13" textLength="200.408">Hasta N imágenes en paralelo,</text><text x="344.28" y="501.988" fill="#000" font-size="13" textLength="134.532">de clientes distintos.</text><text x="344.28" y="517.121" fill="#000" font-size="13" textLength="270.093">Fallo HTTP y disco lleno: decisión abierta.</text><ellipse cx="307.28" cy="497.488" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="307.