# GENERADO por generar-compose.sh. No editar a mano: los cambios se hacen en el generador.
services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    - load_balancer
    environment:
    - INPUT_DIR=/datasets
    - OUTPUT_DIR=/output
    - SERVER_HOST=load_balancer
    - SERVER_PORT=5000
    volumes:
    - ../input/client_0:/datasets
    - ../output/client_0:/output

  load_balancer:
    build:
      context: ./src/
      dockerfile: loadbalancer/Dockerfile
    container_name: load_balancer
    depends_on:
    - gateway_0
    environment:
    - SERVER_HOST=load_balancer
    - SERVER_PORT=5000
    - GATEWAYS=gateway_0:5678

  gateway_0:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - SERVER_HOST=gateway_0
    - SERVER_PORT=5678
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - EXPECTED_QUERIES=4 # Temporal, actualizar cuando se implementen mas queries

  date_filter_0:
    build:
      context: ./src/
      dockerfile: filters/Dockerfile
    container_name: date_filter_0
    depends_on:
    - rabbitmq
    environment:
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672

  q2_filter_0:
    build:
      context: ./src/
      dockerfile: q2filter/Dockerfile
    container_name: q2_filter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - LOG_LEVEL=info

  image_fetcher_0:
    build:
      context: ./src/
      dockerfile: imagefetcher/Dockerfile
    container_name: image_fetcher_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - CHUNK_SIZE=65536
    - LOG_LEVEL=info

  tokenizer_0:
    build:
      context: ./src/
      dockerfile: tokenizer/Dockerfile
    container_name: tokenizer_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - TOKENIZER_ID=0
    - TOKENIZER_AMOUNT=1
    - LOG_LEVEL=info

  q5_avg_partial_0:
    build:
      context: ./src/
      dockerfile: q5avgpartial/Dockerfile
    container_name: q5_avg_partial_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - LOG_LEVEL=info

  q5_filter_0:
    build:
      context: ./src/
      dockerfile: q5filter/Dockerfile
    container_name: q5_filter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - Q5_FILTER_ID=0
    - LOG_LEVEL=info

  q5_avg_aggregator_0:
    build:
      context: ./src/
      dockerfile: q5avgaggregator/Dockerfile
    container_name: q5_avg_aggregator_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - Q5_AVG_PARTIAL_AMOUNT=1
    - Q5_FILTER_AMOUNT=1
    - LOG_LEVEL=info

  q4_word_counter_0:
    build:
      context: ./src/
      dockerfile: q4wordcounter/Dockerfile
    container_name: q4_word_counter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - TOKENIZER_AMOUNT=1
    - LOG_LEVEL=info

  q4_top20_merger_0:
    build:
      context: ./src/
      dockerfile: q4top20merger/Dockerfile
    container_name: q4_top20_merger_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - Q4_WORD_COUNTER_AMOUNT=1
    - LOG_LEVEL=info

  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 15672:15672
