  gateway_0:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - SERVER_HOST=gateway_0
    - SERVER_PORT=5678
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - EXPECTED_QUERIES=5
    - Q1_FILTER_AMOUNT=3
    - Q2_FETCHER_AMOUNT=3
    - Q3_JOIN_AMOUNT=3
    - Q5_FILTER_AMOUNT=3
    - HEALTH_PORT=9090

