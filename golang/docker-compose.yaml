services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    - gateway
    environment:
    - INPUT_DIR=/datasets
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ../Articulos_ejemplo/Ejemplo_pequenio:/datasets
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
    - date_filter_0
    environment:
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - FILTER_HOST=date_filter_0
    - FILTER_PORT=5679
  date_filter_0:
    build:
      context: ./src/
      dockerfile: filters/Dockerfile
    container_name: date_filter_0
    environment:
    - SERVER_HOST=date_filter_0
    - SERVER_PORT=5679
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    #- 5672:5672
    - 15672:15672
