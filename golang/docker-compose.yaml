    - HEALTH_PORT=9090
    - PEERS=1=monitor_1,2=monitor_2
    - TARGETS=load_balancer_0,load_balancer_1,load_balancer_2,gateway_0,gateway_1,gateway_2,q1_filter_0,q1_filter_1,q1_filter_2,q4_word_counter_0,q4_word_counter_1,q4_word_counter_2,q4_top20_merger,tokenizer_0,tokenizer_1,tokenizer_2,q5_avg_partial_0,q5_avg_partial_1,q5_avg_partial_2,q5_avg_aggregator_0,q5_filter_0,q5_filter_1,q5_filter_2
