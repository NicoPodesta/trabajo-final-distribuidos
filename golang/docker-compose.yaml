services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    - load_balancer
    environment:
    - INPUT_DIR=/datasets
    - OUTPUT_DIR=/output
    - SERVER_HOST=load_balancer
    - SERVER_PORT=5000
    volumes:
    - ../Articulos_ejemplo/Ejemplo_pequenio:/datasets
    - ../output:/output

  load_balancer:
    build:
      context: ./src/
      dockerfile: loadbalancer/Dockerfile
    container_name: load_balancer
    depends_on:
    - gateway_0
    environment:
    - SERVER_HOST=load_balancer
    - SERVER_PORT=5000
    - GATEWAYS=gateway_0:5678

  gateway_0:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - SERVER_HOST=gateway_0
    - SERVER_PORT=5678
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672
    - EXPECTED_QUERIES=1 # Temporal, actualizar cuando se implementen mas queries

  date_filter_0:
    build:
      context: ./src/
      dockerfile: filters/Dockerfile
    container_name: date_filter_0
    depends_on:
    - rabbitmq
    environment:
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672

  tokenizer_0:
    build:
      context: ./src/
      dockerfile: tokenizer/Dockerfile
    container_name: tokenizer_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672

  q4_word_counter_0:
    build:
      context: ./src/
      dockerfile: q4wordcounter/Dockerfile
    container_name: q4_word_counter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672

  q4_top20_merger_0:
    build:
      context: ./src/
      dockerfile: q4top20merger/Dockerfile
    container_name: q4_top20_merger_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - MOM_HOST=rabbitmq
    - MOM_PORT=5672

  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 15672:15672
